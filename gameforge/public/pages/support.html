<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameForge | Support</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="site-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="mini-compass">✦</div>
        <h2>INDIE<br>GAME HUB</h2>
      </div>

      <nav class="sidebar-nav">
        <a href="games.html">🎮 Games</a>
        <a href="upload.html">⬆ Upload</a>
        <a href="library.html">📚 My Library</a>
        <a href="account.html">👤 Account</a>
        <a href="admin.html">⚙ Admin</a>
        <a href="support.html">🛠 Support</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Header -->
      <header class="page-header">
        <div>
          <p class="small-heading">INDIE GAME HUB</p>
          <h1>SUPPORT</h1>
        </div>
      </header>

      <!-- Support Options -->
      <section class="support-options">
        <div>
          🎮
          <h3>Game Problem</h3>
          <p>Help with games or downloads.</p>
        </div>

        <div>
          ⬆
          <h3>Upload Problem</h3>
          <p>Help uploading a game.</p>
        </div>

        <div>
          👤
          <h3>Account Problem</h3>
          <p>Help with your account.</p>
        </div>
      </section>

      <!-- Support Form -->
      <section class="content-panel">
        <h2>How Can We Help?</h2>

        <form>

          <!-- Name + Email -->
          <div class="form-row">
            <div class="form-group">
              <label>Name</label>
              <input required>
            </div>

            <div class="form-group">
              <label>Email</label>
              <input type="email" required>
            </div>
          </div>

          <!-- Problem Type -->
          <div class="form-group">
            <label>Problem Type</label>
            <select>
              <option>Game Download</option>
              <option>Game Upload</option>
              <option>Account</option>
              <option>Other</option>
            </select>
          </div>

          <!-- Subject -->
          <div class="form-group">
            <label>Subject</label>
            <input required>
          </div>

          <!-- Description -->
          <div class="form-group">
            <label>Describe Your Problem</label>
            <textarea rows="8" required></textarea>
          </div>

          <!-- Optional Screenshot -->
          <div class="upload-box">
            OPTIONAL SCREENSHOT
            <input type="file" accept="image/*">
          </div>

          <button class="primary-btn">Submit Support Ticket</button>

        </form>
      </section>

    </main>
  </div>
</body>
</html>
