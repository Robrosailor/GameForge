<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameForge | Upload</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="site-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="mini-compass">✦</div>
        <h2>INDIE<br>GAME HUB</h2>
      </div>

      <nav class="sidebar-nav">
        <a href="games.html">🎮 Games</a>
        <a href="upload.html">⬆ Upload</a>
        <a href="library.html">📚 My Library</a>
        <a href="account.html">👤 Account</a>
        <a href="admin.html">⚙ Admin</a>
        <a href="support.html">🛠 Support</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Header -->
      <header class="page-header">
        <div>
          <p class="small-heading">INDIE GAME HUB</p>
          <h1>UPLOAD YOUR GAME</h1>
        </div>
      </header>

      <!-- Upload Form -->
      <section class="content-panel">
        <h2>Game Information</h2>

        <form>

          <!-- Title + Developer -->
          <div class="form-group">
            <label>Game Title</label>
            <input required>
          </div>

          <div class="form-group">
            <label>Developer / Studio</label>
            <input required>
          </div>

          <!-- Genre + Version -->
          <div class="form-row">
            <div class="form-group">
              <label>Genre</label>
              <select>
                <option>Adventure</option>
                <option>Action</option>
                <option>RPG</option>
              </select>
            </div>

            <div class="form-group">
              <label>Version</label>
              <input placeholder="1.0">
            </div>
          </div>

          <!-- Description -->
          <div class="form-group">
            <label>Description</label>
            <textarea rows="6"></textarea>
          </div>

          <!-- Upload Boxes -->
          <div class="upload-box">
            GAME COVER IMAGE
            <input type="file" accept="image/*">
          </div>

          <div class="upload-box">
            SCREENSHOTS
            <input type="file" multiple accept="image/*">
          </div>

          <div class="upload-box">
            GAME FILE
            <input type="file">
          </div>

          <button class="primary-btn">Upload Game</button>

        </form>
      </section>

    </main>
  </div>
</body>
</html>
