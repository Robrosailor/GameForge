<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameForge| Login</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="login-page">

  <main class="login-container">

    <!-- Brand Section -->
    <section class="login-brand">
      <div class="compass-placeholder">✦</div>

      <p class="small-heading">WELCOME TO</p>
      <h1>INDIE GAME HUB</h1>

      <p class="tagline">EXPLORE • CREATE • PLAY • BELONG</p>
      <div class="gold-line"></div>

      <p>Discover games created by independent developers.</p>
    </section>

    <!-- Login Panel -->
    <section class="login-panel">
      <h2>ENTER THE HUB</h2>
      <p class="muted">Sign in to continue</p>

      <form action="games.html">
        <div class="form-group">
          <label>Email</label>
          <input type="email" required placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" required placeholder="Enter your password">
        </div>

        <button class="primary-btn" type="submit">Sign In</button>
      </form>

      <div class="gold-line"></div>

      <p>
        New here?
        <a class="text-link" href="register.html">Create Account</a>
      </p>
    </section>

  </main>

</body>
</html>
