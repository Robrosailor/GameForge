<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameForge | Register</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="login-page">

  <main class="login-container">

    <!-- Brand Section -->
    <section class="login-brand">
      <div class="compass-placeholder">✦</div>

      <p class="small-heading">JOIN THE COMMUNITY</p>
      <h1>INDIE GAME HUB</h1>
      <p class="tagline">EXPLORE • CREATE • PLAY • BELONG</p>
    </section>

    <!-- Registration Form -->
    <section class="login-panel">
      <h2>CREATE ACCOUNT</h2>

      <form>

        <div class="form-group">
          <label>Username</label>
          <input required placeholder="Choose a username">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" required placeholder="Enter your email">
